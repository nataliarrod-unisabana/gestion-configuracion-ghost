name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar-release:
    name: Construir artefactos y publicar release
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Instalar pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: casper/package.json

      - name: Instalar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Construir Casper
        working-directory: casper
        run: |
          pnpm install --frozen-lockfile
          pnpm zip

      - name: Construir Source
        working-directory: source
        run: |
          pnpm install --frozen-lockfile
          pnpm zip

      - name: Publicar release con los artefactos
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            casper/dist/casper.zip
            source/dist/source.zip